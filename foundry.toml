[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = true

# Allow reading files from skill assets
fs_permissions = [
    { access = "read", path = "./" }
]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
pharos_testnet = "${PHAROS_TESTNET_RPC_URL}"

[etherscan]
pharos_testnet = { key = "", url = "https://api.socialscan.io/pharos-atlantic-testnet", chain = 688689 }
